[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heavily-right"
version = "0.1.0"
description = "Heavily-right p-value combination and confidence-region inference"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*"]
maintainers = [{name = "Tianle Liu", email = "tylerliuthu@gmail.com"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
reproduction = ["matplotlib>=3.8", "pandas>=2.1", "seaborn>=0.13"]
dev = ["build>=1.2", "ruff>=0.11"]

[project.scripts]
heavily-right-reproduce = "reproduction.run:main"
heavily-right-replot = "reproduction.replot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heavily_right*", "reproduction*"]
exclude = ["src*", "tests*"]

[tool.setuptools.package-data]
heavily_right = ["py.typed"]
reproduction = ["**/*.md", "network_meta_analysis/data/*.csv"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["E731", "UP007"]

[tool.ruff.lint.per-file-ignores]
"heavily_right/_landau.py" = ["B028"]
"tests/*.py" = ["B017"]
